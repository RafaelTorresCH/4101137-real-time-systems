<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-isr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">
    SoilSense Control — Superloop Flow &amp; GPIO Instrumentation (Task A, ≤ 10 Boxes)
  </text>

  <!-- Box 1: init_hw -->
  <rect x="290" y="45" width="300" height="38" rx="6" fill="#e6f4f1" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">
    1. init_hw() + k_timer_start(1 ms)
  </text>
  <line x1="440" y1="83" x2="440" y2="108" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: task_console -->
  <rect x="250" y="110" width="380" height="46" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">
    2. task_console()  [GPIO20 / D5: instr_cons]
  </text>
  <text x="440" y="147" text-anchor="middle" font-size="10.5" fill="#475569">
    uart_poll_in() → help / status / set / clear / calib (blocking)
  </text>
  <line x1="440" y1="156" x2="440" y2="178" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: task_display -->
  <rect x="250" y="180" width="380" height="44" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">
    3. task_display()  [GPIO23 / D8: instr_disp]
  </text>
  <text x="440" y="215" text-anchor="middle" font-size="10.5" fill="#475569">
    Every 500 ms (if enabled): pushes 1 KB frame over I²C
  </text>
  <line x1="440" y1="224" x2="440" y2="246" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4: task_telemetry -->
  <rect x="250" y="248" width="380" height="44" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">
    4. task_telemetry()  [GPIO21 / D6: instr_tele]
  </text>
  <text x="440" y="283" text-anchor="middle" font-size="10.5" fill="#475569">
    Every 1000 ms: polled printk CSV (~7 ms blocking @ 115200)
  </text>
  <line x1="440" y1="292" x2="440" y2="314" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 5: ticks_pending > 0 -->
  <rect x="280" y="316" width="320" height="38" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="339" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">
    5. if (atomic_get(&amp;ticks_pending) &gt; 0) → atomic_dec()
  </text>
  <line x1="440" y1="354" x2="440" y2="376" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 6: task_sampling -->
  <rect x="250" y="378" width="380" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="397" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">
    6. task_sampling() (1 kHz Hard)  [GPIO18 / D3: instr_samp]
  </text>
  <text x="440" y="413" text-anchor="middle" font-size="10.5" fill="#047857">
    read_pressure_mv(), estop check (&gt;3000 mV), valve software PWM
  </text>
  <line x1="440" y1="422" x2="440" y2="442" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 7: task_control -->
  <rect x="250" y="444" width="380" height="38" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="467" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">
    7. Every 10th sample (10 ms): task_control()  [GPIO19 / D4: instr_ctrl]
  </text>
  <line x1="440" y1="482" x2="440" y2="496" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 8: task_flow_batch -->
  <rect x="250" y="498" width="380" height="34" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
  <text x="440" y="519" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">
    8. task_flow_batch() (if flow_pulses ≥ 100)  [GPIO22 / D7: instr_flow]
  </text>

  <!-- Loopback arrow while(1) -->
  <path d="M 630 515 L 700 515 L 700 133 L 632 133" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="745" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d9488">while (1)</text>

  <!-- ISR 1: tick_isr -->
  <rect x="20" y="305" width="210" height="58" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="125" y="325" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">
    ISR 1: tick_isr (1 kHz k_timer)
  </text>
  <text x="125" y="341" text-anchor="middle" font-size="10" fill="#7f1d1d">
    atomic_inc(&amp;ticks_pending)
  </text>
  <text x="125" y="355" text-anchor="middle" font-size="10" fill="#7f1d1d">
    updates backlog_peak
  </text>
  <line x1="230" y1="335" x2="278" y2="335" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-isr)"/>

  <!-- ISR 2: flow_isr -->
  <rect x="20" y="486" width="210" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="125" y="505" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">
    ISR 2: flow_isr (GPIO3 / D9)
  </text>
  <text x="125" y="522" text-anchor="middle" font-size="10" fill="#7f1d1d">
    atomic_inc(&amp;flow_pulses)
  </text>
  <line x1="230" y1="515" x2="248" y2="515" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-isr)"/>
</svg>

